<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body{
            background: #222;
        }
        .card{
            width: 90%;
            max-width: 470px;
            background: linear-gradient(135deg, #00feba, #5b548a);
            color: #fff;
            margin: 100px auto 0;
            border-radius: 20px;
            padding: 40px 35px;
            text-align: center;
        }
        .search{
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .search input{
            border: 0;
            outline: 0;
            background: #ebfffc;
            color: #555;
            padding: 10px 25px;
            height: 60px;
            border-radius: 30px;
            flex: 1;
            margin-right: 16px;
            font-size: 18px;
        }
        .search button{
            border: 0;
            outline: 0;
            background: #ebfffc;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
        }
        .search button i{
            font-size: 22px;
            color: #555;
        }
        .error{
            text-align: left;
            margin-left: 10px;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .weather{
            margin-top: 30px;
        }
        .weather-icon{
            width: 170px;
            margin-top: 30px;
        }
        .weather h1{
            font-size: 70px;
            font-weight: 500;
        }
        .weather h2{
            font-size: 45px;
            font-weight: 400;
            margin-top: -10px;
        }
        .details{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 50px;
            padding: 0 20px;
        }
        .col{
            display: flex;
            align-items: center;
            text-align: left;
        }
        .col img{
            width: 40px;
            margin-right: 10px;
        }
        .humidity, .wind{
            font-size: 28px;
            margin-top: -6px;
        }
        @media (max-width: 500px) {
        .temp {
            font-size: 50px;
        }
        .city {
            font-size: 25px;
        }
        .details {
            flex-direction: column;
            gap: 15px;
        }
        .col img {
            width: 25px;
        }
        .humidity,
        .wind {
            font-size: 18px;
        }
        .search input {
            padding: 10px 15px;
            font-size: 18px;
        }
        .search button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }
    }
</style>
</head>
<body>
<div class="card">
    <div class="search">
        <input type="text" placeholder="Enter city name" spellcheck="false">
        <button><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
    <div class="error">
        <p>Invalid city name</p>
    </div>
    <div class="weather">
        <img src="clear.png" class="weather-icon">
        <h1 class="temp">22°C</h1>
        <h2 class="city">Bangalore</h2>
        <div class="details">
            <div class="col">
                <img src="humidity.png">
                <div>
                    <p class="humidity">50%</p>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="wind.png">
                <div>
                    <p class="wind">15 km/h</p>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const apiKey = "64cf2288907c796c4628cc3da153ed4e";
    const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";
    const searchBox = document.querySelector(".search input");
    const searchBtn = document.querySelector(".search button");
    const weatherIcon = document.querySelector(".weather-icon");
    async function checkWeather(city) {
        const response = await fetch(apiUrl + city + `&appid=${apiKey}`);
        const data = await response.json();
        if (data.cod === "404") {
            document.querySelector(".error").style.display = "block";
            document.querySelector(".weather").style.display = "none";
            return;
        }
        document.querySelector(".error").style.display = "none";
        document.querySelector(".weather").style.display = "block";
        document.querySelector(".city").innerHTML = data.name;
        document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
        document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
        document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";
        if (data.weather[0].main === "Clouds") {
            weatherIcon.src = "clouds.png";
            weatherIcon.alt="Clouds";
        } else if (data.weather[0].main === "Clear") {
            weatherIcon.src = "clear.png";
            weatherIcon.alt="Clear";
        }    
        else if (data.weather[0].main === "Rain") {
            weatherIcon.src = "rain.png";
            weatherIcon.alt="Rain";
        } else if (data.weather[0].main === "Drizzle") {
            weatherIcon.src = "drizzle.png";
            weatherIcon.alt="Drizzle";
        } else if (data.weather[0].main === "Mist") {
            weatherIcon.src = "mist.png";   
            weatherIcon.alt="Mist";
        } else if (data.weather[0].main === "Snow") {
            weatherIcon.src = "snow.png";
            weatherIcon.alt="Snow";
        } else {
            weatherIcon.src = "clear.png";
            weatherIcon.alt="Clear";
        }
    }
    searchBtn.addEventListener("click", () => {
        checkWeather(searchBox.value);
    });
</script>
</body>
</html>
