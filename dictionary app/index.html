<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary App</title>

<style>
    :root{
        --color:#238ff5;
        --bg-color:white;
        --padding:20px;
        --border-radius:8px;
    }

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background-color: var(--bg-color);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .header, footer{
        background-color: var(--color);
        color: var(--bg-color);
        text-align: center;
        padding: var(--padding);
    }

    header nav h1{
        font-size: 2rem;
    }

    main{
        flex: 1;                 
        padding: var(--padding);
        max-width: 800px;
        margin: auto;
        width: 100%;
    }
    main form{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;              
    flex-wrap: wrap;        
}

    form input[type=text],
form button[type=submit],
button[type=button] {
    border:var(--color) 3px solid;
    font-size: 16px;
    font-weight: 500;
    border-radius: var(--border-radius);
    padding: var(--padding);
}
form input[type=text] {
    width: 60%;
    min-width: 250px;
}


form button[type=submit],
button[type=button] {
    background-color: var(--color);
    color: var(--bg-color);
    cursor: pointer;
}


    .result{
        margin-top: 30px;
        padding: 25px;
        border-radius: 10px;
        background-color: #fff;
        border: 1px solid #ddd;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        line-height: 1.8;
    }

    .result p{
        margin: 10px 0;
    }

    .result strong{
        display: inline-block;
        width: 140px;
    }
    
</style>
</head>
<body>
<header class="header">
    <nav>
        <h1>Dictionary App</h1>
    </nav>
</header>
<main>
    <form>
        <input type="text" placeholder="Enter a word">
        <button type="submit">Search</button>
        <button type="button" id="wordDayBtn">Word Of The Day</button>
    </form>
    <div class="result"></div>
</main>
<footer>
    <p>&copy; 2026 Dictionary App</p>
</footer>
<script>
const form = document.querySelector("form"); 
const result = document.querySelector(".result"); 
form.addEventListener('submit', (e) => {
    e.preventDefault();
    getWordInfo(form.elements[0].value);
});
const wordList = [
  "hope",
  "learn",
  "focus",
  "peace",
  "trust",
  "confidence",
  "growth",
  "patience",
  "success",
  "balance",
  "knowledge",
  "discipline",
  "creativity",
  "respect",
  "truth",
  "courage",
  "wisdom",
  "progress",
  "clarity",
  "purpose",
  "strength",
  "determination",
  "responsibility",
  "consistency",
  "adaptability",
  "innovation",
  "perseverance",
  "integrity",
  "efficiency",
  "resilience"
];
const getWordOfTheDay = () => {
    const today = new Date().getDate();
    return wordList[today % wordList.length];
};
const getWordInfo = async (word) => {
    const response = await fetch(
        `https://api.dictionaryapi.dev/api/v2/entries/en/${word}`
    );
    const data = await response.json();
    let definitions = data[0].meanings[0].definitions[0];
    result.innerHTML = `
        <p><strong>Word:</strong> ${data[0].word}</p>
        <p><strong>Parts of Speech:</strong> ${data[0].meanings[0].partOfSpeech}</p>
        <p><strong>Meaning:</strong> ${definitions.definition ?? "Not Found"}</p>
        <p><strong>Example:</strong> ${definitions.example ?? "Not Found"}</p>
        <p><strong>Antonyms:</strong> <span class="antonyms"></span></p>
    `;
    const antonymSpan = document.querySelector(".antonyms");
    if (!definitions.antonyms || definitions.antonyms.length === 0) {
        antonymSpan.textContent = "Not Found";
    } else {
        for (let antonym of definitions.antonyms) {
            antonymSpan.textContent += antonym + ", ";
        }
    }
    console.log(data);
};
const wordDayBtn = document.querySelector("#wordDayBtn");
wordDayBtn.addEventListener("click", () => {
    getWordInfo(getWordOfTheDay());
});
</script>
</body>
</html>
